<!doctype html>

<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pixel Crowd · Administración</title>
<style>
  :root { --bg: #0b0b10; --panel: #15151e; --borde: #2a2a38; --texto: #eeeef5; --suave: #8f8fa6; --acento: #ff3d7f; --ok: #3ddc84; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--texto); font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .marca { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: 0.18em; font-size: 11px; color: var(--suave); }
  .marca .logo { width: 14px; height: 14px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: var(--suave); margin: 0 0 20px; }
  form { display: flex; flex-direction: column; gap: 10px; max-width: 340px; }
  label { color: var(--suave); font-size: 13px; }
  input[type=password] { padding: 12px; font: inherit; font-size: 16px; color: var(--texto); background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; }
  button, .boton { font: inherit; cursor: pointer; }
  .principal { padding: 12px; border: 0; border-radius: 10px; background: var(--acento); color: #fff; font-weight: 700; }
  .error { color: #ff7a8a; min-height: 18px; margin: 0; font-size: 13px; }
  .eventos { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .evento { background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 14px; }
  .evento.ultimo { border-color: var(--acento); }
  .evento h2 { font-size: 17px; margin: 0; }
  .evento p { margin: 2px 0 12px; color: var(--suave); font-size: 14px; }
  .evento .etiqueta { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--borde); font-size: 11px; color: var(--suave); vertical-align: 2px; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; }
  .acciones a { padding: 9px 14px; border-radius: 10px; border: 1px solid var(--borde); color: var(--texto); text-decoration: none; }
  .acciones a.panel { background: var(--acento); border-color: var(--acento); color: #fff; font-weight: 700; }
  .pie { margin-top: 24px; display: flex; gap: 12px; color: var(--suave); font-size: 13px; }
  .pie button { background: none; border: 0; color: inherit; text-decoration: underline; padding: 0; }
  :focus-visible { outline: 3px solid var(--texto); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="marca"><svg class="logo" viewBox="0 0 11 11" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="#ff3d7f"/><rect x="4" y="0" width="3" height="3" fill="#fff"/><rect x="8" y="0" width="3" height="3" fill="#ff3d7f"/><rect x="0" y="4" width="3" height="3" fill="#fff"/><rect x="4" y="4" width="3" height="3" fill="#ff3d7f"/><rect x="8" y="4" width="3" height="3" fill="#4a4a5e"/><rect x="0" y="8" width="3" height="3" fill="#ff3d7f"/><rect x="4" y="8" width="3" height="3" fill="#4a4a5e"/><rect x="8" y="8" width="3" height="3" fill="#fff"/></svg>PIXEL CROWD</div>
  <h1>Administración</h1>

  <form id="form-login" autocomplete="on" hidden>
    <p class="sub">Ingresa la clave general una vez: sirve para todos los eventos.</p>
    <input type="text" name="username" value="admin" autocomplete="username" hidden>
    <label for="clave">Clave de administrador</label>
    <input type="password" id="clave" autocomplete="current-password" required>
    <button class="principal" id="entrar" type="submit">Entrar</button>
    <p class="error" id="error" role="alert"></p>
  </form>

  <section id="lista" hidden>
    <p class="sub">Elige el evento que vas a operar.</p>
    <ul class="eventos" id="eventos"></ul>
    <div class="pie"><a href="/" style="color:inherit">Ver la lista pública</a><button id="salir" type="button">Cerrar sesión</button></div>
  </section>
</main>

<script src="/sesion.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const SITUACION = { hoy: 'hoy', proximo: '', terminado: 'terminado' };

  async function mostrarEventos() {
    const r = await fetch('/api/eventos', { headers: { 'x-sesion': Sesion.get() }, cache: 'no-store' });
    const lista = await r.json();
    let ultimo = '';
    try { ultimo = localStorage.getItem('pc-ultimo-evento') || ''; } catch (e) {}
    $('eventos').innerHTML = lista.map((e) => `
      <li class="evento${e.slug === ultimo ? ' ultimo' : ''}">
        <h2>${e.titulo}${e.oculto ? '<span class="etiqueta">oculto</span>' : ''}${SITUACION[e.situacion] ? `<span class="etiqueta">${SITUACION[e.situacion]}</span>` : ''}${e.slug === ultimo ? '<span class="etiqueta">último usado</span>' : ''}</h2>
        <p>${[e.lugar, e.fecha].filter(Boolean).join(', ')}</p>
        <div class="acciones">
          <a class="panel" href="/${e.slug}/operador">Panel</a>
          <a href="/${e.slug}/simulador">Simulador</a>
          <a href="/${e.slug}/conectar" target="_blank">QR</a>
          <a href="/${e.slug}" target="_blank">Página del público</a>
        </div>
      </li>`).join('');
    $('form-login').hidden = true;
    $('lista').hidden = false;
  }

  $('salir').onclick = async () => { await Sesion.salir(); location.reload(); };

  // ¿Hay una sesión general válida? (sin evento, /api/sesion valida la clave general)
  const valida = await fetch('/api/sesion', { headers: { 'x-sesion': Sesion.get() }, cache: 'no-store' })
    .then((r) => r.json()).then((d) => d.valida).catch(() => false);
  if (valida) return mostrarEventos();

  $('form-login').hidden = false;
  $('clave').focus();
  $('form-login').onsubmit = async (e) => {
    e.preventDefault();
    $('entrar').disabled = true;
    try {
      const d = await Sesion.ingresar($('clave').value);
      if (d.alcance !== '*') throw new Error('Esa clave es de un solo evento: entra desde la dirección de ese evento');
      await mostrarEventos();
    } catch (err) {
      $('error').textContent = err.message;
      $('clave').select();
    } finally {
      $('entrar').disabled = false;
    }
  };
})();
</script>
</body>
</html>
