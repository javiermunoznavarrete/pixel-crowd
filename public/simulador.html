<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador del estadio</title>
<style>
  :root { --bg: #07070b; --panel: #12121a; --borde: #262634; --texto: #ececf3; --suave: #8c8ca3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--texto); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--borde); }
  header h1 { font-size: 16px; margin: 0; }
  header label { display: flex; align-items: center; gap: 8px; color: var(--suave); }
  body.embed header h1 { display: none; }
  main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; padding: 16px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .caja { background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 12px; }
  .caja h2 { font-size: 13px; font-weight: 600; color: var(--suave); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.06em; }
  canvas { display: block; width: 100%; }
  .frontal { margin-bottom: 14px; }
  .frontal:last-child { margin-bottom: 0; }
  .frontal .t { font-size: 13px; margin-bottom: 4px; }
  .frontal .t span { color: var(--suave); }
</style>
</head>
<body>
<header>
  <h1>Simulador del estadio</h1>
  <label>Participación <input type="range" id="part" min="10" max="100" value="60"> <span id="part-v">60%</span></label>
  <label><input type="checkbox" id="real"> Cancha con posición real (sin declarar)</label>
</header>
<main>
  <div class="caja">
    <h2>Vista aérea</h2>
    <canvas id="mapa"></canvas>
  </div>
  <div class="caja">
    <h2>Galerías vistas de frente (mosaicos)</h2>
    <div id="frontales"></div>
  </div>
</main>

<script src="/show.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');

  const recinto = await Show.cargarRecinto();
  const reproductor = Show.crearReproductor();
  Show.sincronizarReloj();
  setInterval(Show.sincronizarReloj, 30000);
  Show.conectar({ rol: 'simulador', alEstado: (e) => reproductor.actualizar(e) });

  // Pseudoaleatorio con semilla para que la simulación sea estable entre recargas
  let semilla = 7;
  const azar = () => ((semilla = (semilla * 16807) % 2147483647) / 2147483647);

  // ---- Teléfonos virtuales ----
  const telefonos = [];
  for (const s of recinto.sectores) {
    if (s.tipo === 'numerada') {
      for (const a of s.mapa.values()) {
        telefonos.push({ zona: s.id, x: a.x, y: a.y, pos: { zona: s.id, x: a.x, y: a.y, grid: a.grid }, sector: s, r: azar() });
      }
    } else {
      const { x1, y1, x2, y2 } = s.rect;
      for (let i = 0; i < 1800; i++) {
        const x = x1 + azar() * (x2 - x1), y = y1 + azar() * (y2 - y1);
        const p = Show.PROFUNDIDADES[Math.min(2, Math.floor((y - y1) / (y2 - y1) * 3))].id;
        const l = Show.LADOS[Math.min(2, Math.floor((x - x1) / (x2 - x1) * 3))].id;
        telefonos.push({
          zona: s.id, x, y, r: azar(),
          pos: Show.posicionDe(recinto, { sector: s.id, profundidad: p, lado: l }), // lo que declara
          posReal: { zona: s.id, x, y, grid: null },
        });
      }
    }
  }

  // ---- Límites del mapa ----
  const e = recinto.escenario;
  let minX = e.x1, maxX = e.x2, minY = e.y1, maxY = e.y2;
  for (const t of telefonos) { minX = Math.min(minX, t.x); maxX = Math.max(maxX, t.x); minY = Math.min(minY, t.y); maxY = Math.max(maxY, t.y); }
  minX -= 2; maxX += 2; minY -= 2; maxY += 2;

  const mapa = $('mapa');
  const ctx = mapa.getContext('2d');
  let escala = 1;
  function ajustarMapa() {
    const dpr = window.devicePixelRatio || 1;
    const ancho = mapa.clientWidth;
    escala = ancho / (maxX - minX);
    mapa.style.height = (maxY - minY) * escala + 'px';
    mapa.width = ancho * dpr;
    mapa.height = (maxY - minY) * escala * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---- Vistas frontales de sectores numerados ----
  const frontales = recinto.sectores.filter((s) => s.tipo === 'numerada').map((s) => {
    const div = document.createElement('div');
    div.className = 'frontal';
    div.innerHTML = `<div class="t">${s.nombre} <span>· vista desde ${s.vistaDesde || 'el frente'}</span></div>`;
    const c = document.createElement('canvas');
    div.appendChild(c);
    $('frontales').appendChild(div);
    return { s, c, ctx: c.getContext('2d'), tels: telefonos.filter((t) => t.sector === s) };
  });
  function ajustarFrontales() {
    const dpr = window.devicePixelRatio || 1;
    for (const f of frontales) {
      const ancho = f.c.clientWidth;
      f.celda = ancho / f.s.cols;
      f.c.style.height = f.celda * f.s.rows + 'px';
      f.c.width = ancho * dpr;
      f.c.height = f.celda * f.s.rows * dpr;
      f.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  function ajustar() { ajustarMapa(); ajustarFrontales(); }
  window.addEventListener('resize', ajustar);
  ajustar();

  $('part').oninput = () => $('part-v').textContent = $('part').value + '%';

  function cuadro() {
    const t = Show.ahora();
    const part = $('part').value / 100;
    const real = $('real').checked;

    ctx.fillStyle = '#07070b';
    ctx.fillRect(0, 0, mapa.width, mapa.height);
    ctx.fillStyle = '#2b2b3a';
    ctx.fillRect((e.x1 - minX) * escala, (e.y1 - minY) * escala, (e.x2 - e.x1) * escala, (e.y2 - e.y1) * escala);
    ctx.fillStyle = '#8c8ca3';
    ctx.font = '12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('ESCENARIO', (0 - minX) * escala, ((e.y1 + e.y2) / 2 - minY) * escala + 4);

    const tam = Math.max(1.5, 0.5 * escala);
    for (const tel of telefonos) {
      if (tel.r > part) continue;
      const pos = real && tel.posReal ? tel.posReal : tel.pos;
      ctx.fillStyle = Show.css(Show.colorEn(reproductor.capa(tel.zona, t), pos, t));
      ctx.fillRect((tel.x - minX) * escala, (tel.y - minY) * escala, tam, tam);
    }

    for (const f of frontales) {
      f.ctx.fillStyle = '#000';
      f.ctx.fillRect(0, 0, f.c.width, f.c.height);
      const capa = reproductor.capa(f.s.id, t);
      for (const tel of f.tels) {
        if (tel.r > part) continue;
        const g = tel.pos.grid;
        f.ctx.fillStyle = Show.css(Show.colorEn(capa, tel.pos, t));
        f.ctx.fillRect(g.col * f.celda, (g.rows - 1 - g.row) * f.celda, Math.max(1, f.celda - 1), Math.max(1, f.celda - 1));
      }
    }
    requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);
})();
</script>
</body>
</html>
