<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Crowd · Simulador</title>
<style>
  :root { --bg: #07070b; --panel: #12121a; --borde: #262634; --texto: #ececf3; --suave: #8c8ca3; --acento: #ff3d7f; --ok: #3ddc84; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--texto); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--borde); }
  header h1 { font-size: 16px; margin: 0; }
  header label { display: flex; align-items: center; gap: 8px; color: var(--suave); }
  body.embed header h1 { display: none; }
  .modo { display: inline-flex; border: 1px solid var(--borde); border-radius: 999px; overflow: hidden; }
  .modo button { font: inherit; color: var(--suave); background: none; border: 0; padding: 6px 14px; cursor: pointer; }
  .modo button.sel { background: var(--acento); color: #fff; }
  .indicador { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--borde); }
  .indicador .grande { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .indicador .dato { color: var(--suave); }
  .indicador .dato b { color: var(--texto); font-variant-numeric: tabular-nums; }
  .barra { flex: 1 1 160px; height: 8px; background: #1f1f2b; border-radius: 4px; overflow: hidden; min-width: 120px; align-self: center; }
  .barra i { display: block; height: 100%; background: var(--ok); width: 0; transition: width 0.5s; }
  main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; padding: 16px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .caja { background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 12px; }
  .caja h2 { font-size: 13px; font-weight: 600; color: var(--suave); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.06em; }
  canvas { display: block; width: 100%; }
  .frontal { margin-bottom: 14px; }
  .frontal:last-child { margin-bottom: 0; }
  .frontal .t { font-size: 13px; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
  .frontal .t span { color: var(--suave); }
  #frontales { max-height: 70vh; overflow-y: auto; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Pixel Crowd · Simulador del estadio</h1>
  <div class="modo" role="group" aria-label="Modo">
    <button data-modo="vivo" class="sel">En vivo</button>
    <button data-modo="sim">Simulación</button>
  </div>
  <label class="solo-sim" hidden>Participación <input type="range" id="part" min="10" max="100" value="60"> <span id="part-v">60%</span></label>
  <label class="solo-sim" hidden><input type="checkbox" id="real"> Cancha con posición real (sin declarar)</label>
</header>
<div class="indicador" id="indicador"></div>
<main>
  <div>
    <div class="caja" data-plegable="aerea">
      <h2>Vista aérea</h2>
      <canvas id="mapa"></canvas>
    </div>
    <div class="caja" style="margin-top:16px" data-plegable="escena">
      <h2>Vista desde el escenario (cómo ve la banda a todo el público)</h2>
      <canvas id="escena"></canvas>
    </div>
  </div>
  <div class="caja" data-plegable="mosaicos" data-plegado-movil>
    <h2>Sectores numerados vistos de frente (mosaicos)</h2>
    <div id="frontales"></div>
  </div>
</main>

<script src="/plegables.js"></script>
<script src="/sesion.js"></script>
<script src="/show.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');

  // El simulador muestra la ocupación real: requiere la sesión del administrador
  if ((await Sesion.verificar()) !== true) {
    $('indicador').innerHTML = '<span class="dato">Ingresa la clave en el <a href="/' + Show.evento + '/operador" style="color:inherit"><b>panel del operador</b></a> y recarga esta página.</span>';
    return;
  }

  const recinto = await Show.cargarRecinto();
  const reproductor = Show.crearReproductor();
  const indice = Show.indiceAsientos(recinto);
  let ocupacion = null; // ocupación real informada por el servidor
  let modo = 'vivo';

  Show.sincronizarReloj();
  setInterval(Show.sincronizarReloj, 30000);
  Show.conectar({
    rol: 'simulador',
    sesion: Sesion.get(),
    alEstado: (e) => reproductor.actualizar(e),
    alOcupacion: (o) => { ocupacion = o; actualizarIndicador(); },
  });

  // Pseudoaleatorio con semilla para que la simulación sea estable entre recargas
  let semilla = 7;
  const azar = () => ((semilla = (semilla * 16807) % 2147483647) / 2147483647);

  // ---- Teléfonos ----
  // Asientos: uno por asiento numerado. Zonas generales: una reserva de puntos por subzona; en modo
  // simulación se usan todos, en vivo solo tantos como teléfonos declararon esa subzona.
  const asientos = [];
  const generales = []; // { s, subzonas: { clave: [puntos] } }
  const MAX_PUNTOS_SUBZONA = 400;
  for (const s of recinto.sectores) {
    if (s.tipo === 'numerada') {
      for (const a of s.mapa.values()) {
        asientos.push({ zona: s.id, x: a.x, y: a.y, pos: { zona: s.id, x: a.x, y: a.y, grid: a.grid, vista: a.vista }, sector: s, r: azar(),
          idx: indice.get(`${s.id}|${a.fila}|${a.asiento}`) });
      }
    } else {
      const { x1, y1, x2, y2 } = s.rect;
      const subzonas = {};
      Show.PROFUNDIDADES.forEach((p, iy) => Show.LADOS.forEach((l, ix) => {
        const pos = Show.posicionDe(recinto, { sector: s.id, profundidad: p.id, lado: l.id });
        const puntos = [];
        for (let i = 0; i < MAX_PUNTOS_SUBZONA; i++) {
          const x = x1 + (ix + azar()) * (x2 - x1) / 3, y = y1 + (iy + azar()) * (y2 - y1) / 3;
          puntos.push({ zona: s.id, x, y, r: azar(), pos,
            posReal: { zona: s.id, x, y, grid: null, rel: Show.relEnRect(s.rectGrupo || s.rect, x, y), vista: Show.vistaEn(recinto, x, y) } });
        }
        subzonas[p.id + '-' + l.id] = puntos;
      }));
      generales.push({ s, subzonas });
    }
  }
  const capacidad = {};
  for (const a of asientos) capacidad[a.zona] = (capacidad[a.zona] || 0) + 1;

  // ---- Indicador de participación ----
  const fmt = (n) => n.toLocaleString('es-CL');
  function actualizarIndicador() {
    if (modo !== 'vivo') {
      $('indicador').innerHTML = `<span class="dato">Modo simulación: ${$('part').value}% de participación imaginaria. Cambia a <b>En vivo</b> para ver los teléfonos reales.</span>`;
      return;
    }
    if (!ocupacion) { $('indicador').innerHTML = '<span class="dato">Esperando datos del servidor…</span>'; return; }
    let ocupados = 0;
    const porSector = {};
    for (const a of asientos) if (ocupacion.ocupado(a.idx)) { ocupados++; porSector[a.zona] = (porSector[a.zona] || 0) + 1; }
    let enGenerales = 0;
    const detalleGen = [];
    for (const { s } of generales) {
      const n = Object.values(ocupacion.generales[s.id] || {}).reduce((a, b) => a + b, 0);
      enGenerales += n;
      detalleGen.push(`${s.nombre}: <b>${fmt(n)}</b>`);
    }
    const pct = asientos.length ? (100 * ocupados / asientos.length) : 0;
    const top = Object.entries(porSector).map(([z, n]) => [z, n / capacidad[z]]).sort((a, b) => b[1] - a[1]).slice(0, 3)
      .map(([z, p]) => `${recinto.porId[z].nombre} ${Math.round(p * 100)}%`).join(' · ');
    $('indicador').innerHTML = `
      <span class="grande">${fmt(ocupados + enGenerales)}</span><span class="dato">teléfonos encendidos</span>
      <span class="dato">Asientos: <b>${fmt(ocupados)}</b> de ${fmt(asientos.length)} (<b>${pct.toFixed(1)}%</b>)</span>
      <span class="barra" title="Ocupación de asientos numerados"><i style="width:${Math.min(100, pct)}%"></i></span>
      <span class="dato">${detalleGen.join(' · ')}</span>
      ${top ? `<span class="dato">Más llenos: ${top}</span>` : ''}`;
  }

  // ---- Modo ----
  document.querySelectorAll('.modo button').forEach((b) => b.onclick = () => {
    modo = b.dataset.modo;
    document.querySelectorAll('.modo button').forEach((x) => x.classList.toggle('sel', x === b));
    document.querySelectorAll('.solo-sim').forEach((x) => x.hidden = modo !== 'sim');
    actualizarIndicador();
  });
  $('part').oninput = () => { $('part-v').textContent = $('part').value + '%'; actualizarIndicador(); };
  actualizarIndicador();

  // ---- Límites del mapa ----
  const e = recinto.escenario;
  let minX = e.x1, maxX = e.x2, minY = e.y1, maxY = e.y2;
  for (const t of asientos) { minX = Math.min(minX, t.x); maxX = Math.max(maxX, t.x); minY = Math.min(minY, t.y); maxY = Math.max(maxY, t.y); }
  for (const { s } of generales) { minX = Math.min(minX, s.rect.x1); maxX = Math.max(maxX, s.rect.x2); minY = Math.min(minY, s.rect.y1); maxY = Math.max(maxY, s.rect.y2); }
  minX -= 2; maxX += 2; minY -= 2; maxY += 2;

  const mapa = $('mapa');
  const ctx = mapa.getContext('2d');
  let escala = 1;
  function ajustarMapa() {
    const dpr = window.devicePixelRatio || 1;
    const ancho = mapa.clientWidth;
    escala = ancho / (maxX - minX);
    mapa.style.height = (maxY - minY) * escala + 'px';
    mapa.width = ancho * dpr;
    mapa.height = (maxY - minY) * escala * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---- Vistas frontales de sectores numerados ----
  const frontales = recinto.sectores.filter((s) => s.tipo === 'numerada').map((s) => {
    const div = document.createElement('div');
    div.className = 'frontal';
    div.innerHTML = `<div class="t"><div>${s.nombre} <span>· vista desde ${s.vistaDesde || 'el frente'}</span></div><span class="pct"></span></div>`;
    const c = document.createElement('canvas');
    div.appendChild(c);
    $('frontales').appendChild(div);
    return { s, c, ctx: c.getContext('2d'), tels: asientos.filter((t) => t.sector === s), pct: div.querySelector('.pct') };
  });
  function ajustarFrontales() {
    const dpr = window.devicePixelRatio || 1;
    for (const f of frontales) {
      const ancho = f.c.clientWidth;
      f.celda = ancho / f.s.cols;
      f.c.style.height = f.celda * f.s.rows + 'px';
      f.c.width = ancho * dpr;
      f.c.height = f.celda * f.s.rows * dpr;
      f.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  // Vista desde el escenario: cada teléfono en su posición proyectada (u: izquierda→derecha, v: arriba→abajo)
  const escena = $('escena');
  const ctxEscena = escena.getContext('2d');
  let anchoEscena = 1, altoEscena = 1;
  function ajustarEscena() {
    const dpr = window.devicePixelRatio || 1;
    anchoEscena = escena.clientWidth;
    altoEscena = anchoEscena * 2 / 3; // proporción de la bandera
    escena.style.height = altoEscena + 'px';
    escena.width = anchoEscena * dpr;
    escena.height = altoEscena * dpr;
    ctxEscena.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function ajustar() { ajustarMapa(); ajustarFrontales(); ajustarEscena(); }
  window.addEventListener('resize', ajustar);
  ajustar();

  // ¿Este asiento tiene un teléfono encendido? (en vivo: real; en simulación: al azar según el %)
  const encendido = (t, part) => (modo === 'vivo' ? !!ocupacion && ocupacion.ocupado(t.idx) : t.r <= part);
  const VACIO = '#1a1a26';

  function cuadro() {
    const t = Show.ahora();
    const part = $('part').value / 100;
    const real = $('real').checked;

    ctx.fillStyle = '#07070b';
    ctx.fillRect(0, 0, mapa.width, mapa.height);
    ctx.fillStyle = '#2b2b3a';
    ctx.fillRect((e.x1 - minX) * escala, (e.y1 - minY) * escala, (e.x2 - e.x1) * escala, (e.y2 - e.y1) * escala);
    ctx.fillStyle = '#8c8ca3';
    ctx.font = '12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('ESCENARIO', ((e.x1 + e.x2) / 2 - minX) * escala, ((e.y1 + e.y2) / 2 - minY) * escala + 4);

    // Zonas generales: contorno tenue y un punto por teléfono
    for (const { s, subzonas } of generales) {
      ctx.strokeStyle = '#262634';
      ctx.strokeRect((s.rect.x1 - minX) * escala, (s.rect.y1 - minY) * escala, (s.rect.x2 - s.rect.x1) * escala, (s.rect.y2 - s.rect.y1) * escala);
      const capa = reproductor.capa(s.id, t);
      const tam = Math.max(1.5, 0.6 * escala);
      for (const [clave, puntos] of Object.entries(subzonas)) {
        const n = modo === 'vivo' ? Math.min(puntos.length, (ocupacion && ocupacion.generales[s.id]?.[clave]) || 0) : puntos.length;
        for (let i = 0; i < n; i++) {
          const p = puntos[i];
          if (modo === 'sim' && p.r > part) continue;
          const pos = modo === 'sim' && real ? p.posReal : p.pos;
          ctx.fillStyle = Show.css(Show.colorEn(capa, pos, t));
          ctx.fillRect((p.x - minX) * escala, (p.y - minY) * escala, tam, tam);
        }
      }
    }

    // Asientos: encendidos con su color, vacíos en gris oscuro para ver la forma del recinto
    const tam = Math.max(1.5, 0.5 * escala);
    ctxEscena.fillStyle = '#07070b';
    ctxEscena.fillRect(0, 0, anchoEscena, altoEscena);
    const tamE = Math.max(1.5, anchoEscena / 220);
    for (const a of asientos) {
      const on = encendido(a, part);
      const color = on ? Show.css(Show.colorEn(reproductor.capa(a.zona, t), a.pos, t)) : VACIO;
      ctx.fillStyle = color;
      ctx.fillRect((a.x - minX) * escala, (a.y - minY) * escala, tam, tam);
      if (on && a.pos.vista) {
        ctxEscena.fillStyle = color;
        ctxEscena.fillRect(a.pos.vista.u * anchoEscena, a.pos.vista.v * altoEscena, tamE, tamE);
      }
    }
    // Zonas generales en la vista desde el escenario (posición declarada o real, según el modo)
    for (const { s, subzonas } of generales) {
      const capa = reproductor.capa(s.id, t);
      for (const [clave, puntos] of Object.entries(subzonas)) {
        const n = modo === 'vivo' ? Math.min(puntos.length, (ocupacion && ocupacion.generales[s.id]?.[clave]) || 0) : puntos.length;
        for (let i = 0; i < n; i++) {
          const p = puntos[i];
          if (modo === 'sim' && p.r > part) continue;
          const pos = modo === 'sim' && real ? p.posReal : p.pos;
          if (!pos.vista) continue;
          // Dispersión leve para que la gente de una misma subzona no quede en un solo punto
          const ju = modo === 'sim' && real ? 0 : (p.r - 0.5) * 0.04, jv = modo === 'sim' && real ? 0 : ((p.r * 7) % 1 - 0.5) * 0.04;
          ctxEscena.fillStyle = Show.css(Show.colorEn(capa, pos, t));
          ctxEscena.fillRect((pos.vista.u + ju) * anchoEscena, (pos.vista.v + jv) * altoEscena, tamE, tamE);
        }
      }
    }

    for (const f of frontales) {
      f.ctx.fillStyle = '#000';
      f.ctx.fillRect(0, 0, f.c.width, f.c.height);
      const capa = reproductor.capa(f.s.id, t);
      let n = 0;
      for (const a of f.tels) {
        const on = encendido(a, part);
        if (on) n++;
        const g = a.pos.grid;
        f.ctx.fillStyle = on ? Show.css(Show.colorEn(capa, a.pos, t)) : VACIO;
        f.ctx.fillRect(g.col * f.celda, (g.rows - 1 - g.row) * f.celda, Math.max(1, f.celda - 1), Math.max(1, f.celda - 1));
      }
      const txt = `${n} / ${f.tels.length}`;
      if (f.pct.textContent !== txt) f.pct.textContent = txt;
    }
    requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);
})();
</script>
</body>
</html>
